{% extends 'hrm/base.html' %}

{% block title %}Create Task Status — Luminous HRM{% endblock %}

{% block content %}

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
  <div>
    <h1 style="font-size:28px; font-weight:700; color:var(--ink); margin:0;">Create Task Status</h1>
    <div style="font-size:14px; color:var(--muted); margin-top:4px;">Home · Work · Tasks · Create Status</div>
  </div>
  <a href="{% url 'task_list' %}" class="btn" style="background:white; color:var(--brand); border:1px solid var(--brand);">← Back to Tasks</a>
</div>

<div class="card" style="max-width:600px;">
  <div style="padding:20px;">
    <form method="POST">
      {% csrf_token %}
      
      <div style="margin-bottom:20px;">
        <label style="display:block; font-weight:600; margin-bottom:8px;">Project</label>
        <select name="project" required style="width:100%; padding:10px; border:1px solid var(--line); border-radius:6px;">
          <option value="">Select a project</option>
          {% for project in projects %}
          <option value="{{ project.pk }}">{{ project.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block; font-weight:600; margin-bottom:8px;">Status Name</label>
        <input type="text" name="name" required placeholder="e.g., Testing, Review, etc." style="width:100%; padding:10px; border:1px solid var(--line); border-radius:6px;">
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block; font-weight:600; margin-bottom:8px;">Column Color</label>
        <input type="color" name="color" value="#6B7280" style="width:100%; height:40px; border:1px solid var(--line); border-radius:6px; cursor:pointer;">
        <div style="font-size:12px; color:var(--muted); margin-top:4px;">This color will be used for the Kanban column header</div>
      </div>

      <div style="display:flex; gap:10px; margin-top:24px;">
        <button type="submit" class="btn" style="background:#FF6B00; color:white; border:none; flex:1;">Create Status</button>
        <a href="{% url 'task_list' %}" class="btn" style="background:white; color:var(--brand); border:1px solid var(--brand);">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
